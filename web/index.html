<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairotron REPL</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header>
      <span class="brand">Kairotron</span>
      <button id="run" title="Run (Ctrl+Enter)">&#9654; Run</button>
      <button id="fork" title="Fork a what-if branch at the playhead">&#9106; Fork</button>
      <label>start <input id="h-start" size="4" placeholder="auto" /></label>
      <label>end <input id="h-end" size="5" placeholder="auto" /></label>
      <label>unit
        <select id="h-unit">
          <option value="">auto</option>
          <option>year</option>
          <option>quarter</option>
          <option>month</option>
          <option>week</option>
          <option>day</option>
          <option>hour</option>
          <option>minute</option>
          <option>second</option>
        </select>
      </label>
      <label>convention
        <select id="h-convention" title="day-count convention for rate and horizon conversion">
          <option value="">auto</option>
          <option>abstract</option>
          <option>actual/365</option>
          <option>30/360</option>
        </select>
      </label>
      <label>mc paths
        <input id="mc-paths" size="5" placeholder="off" title="Monte Carlo: sample this many stochastic paths (empty = deterministic)" />
      </label>
      <label>mc seed
        <input id="mc-seed" size="6" placeholder="1" title="Monte Carlo seed — same seed re-runs the same paths" />
      </label>
      <label>stocks
        <select id="chart-mode">
          <option value="stacked">stacked</option>
          <option value="lines">lines</option>
        </select>
      </label>
      <span class="spacer"></span>
      <label title="Saved scenario sets (localStorage)">scenario
        <select id="scenario">
          <option value="">— saved —</option>
        </select>
      </label>
      <button id="scen-save" title="Save the model and horizon/MC controls into a scenario set">&#128190; Save</button>
      <button id="scen-del" title="Delete the selected scenario">&#10005;</button>
      <button id="share" title="Copy a URL that reproduces the model, horizon, Monte Carlo inputs, playhead, and branches">Share</button>
      <button id="exp-csv" title="Download CSV">CSV</button>
      <button id="exp-json" title="Download JSON">JSON</button>
      <a id="docs" class="linkbtn" href="/docs/" title="Documentation">Docs</a>
      <span id="status"></span>
    </header>
    <div id="save-pane" hidden>
      <span>save scenario</span>
      <label>set <input id="save-set" size="12" placeholder="default" /></label>
      <label>name <input id="save-name" size="14" /></label>
      <button id="save-ok">Save</button>
      <button id="save-cancel">Cancel</button>
    </div>
    <div id="branchbar" hidden></div>
    <main>
      <section id="editor-pane"><div id="editor"></div></section>
      <div
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        tabindex="0"
        title="Drag to resize · double-click to reset"
      ></div>
      <section id="view-pane">
        <div class="pane">
          <svg id="stocks-chart" viewBox="0 0 900 280" preserveAspectRatio="none"></svg>
          <div id="stocks-legend" class="legend"></div>
        </div>
        <div class="pane" id="diff-pane" hidden>
          <svg id="diff-chart" viewBox="0 0 900 150" preserveAspectRatio="none"></svg>
          <div id="diff-legend" class="legend"></div>
        </div>
        <div class="pane" id="derived-pane">
          <svg id="derived-chart" viewBox="0 0 900 150" preserveAspectRatio="none"></svg>
          <div id="derived-legend" class="legend"></div>
        </div>
        <div id="scrub">
          <input id="slider" type="range" min="0" max="0" step="1" value="0" />
          <span id="playhead-label"></span>
        </div>
        <div id="lower">
          <div id="tabs">
            <button data-tab="inspector" class="active">Inspector</button>
            <button data-tab="table">Table</button>
          </div>
          <div id="tab-body"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
